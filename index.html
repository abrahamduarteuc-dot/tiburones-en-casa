<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6BA8">
<title>Tiburones en Casa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --laguna:#EAF6FB; --laguna2:#D6ECF6; --oceano:#0E6BA8; --oceano-d:#0B4F7E; --abismo:#14324A; --muted:#5B7A93;
  --coral:#FF6F59; --coral-d:#C9442F; --sol:#FFC53D; --sol-d:#D99A00; --alga:#1FB58F; --alga-d:#148A6B;
  --uva:#8E5CFF; --uva-d:#6A3BD6; --blanco:#fff; --linea:#CFE4F0; --asfalto:#3A4A5C;
  --disp:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--body);color:var(--abismo);background:var(--laguna);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%,#fff 0 60px,transparent 61px),radial-gradient(circle at 92% 30%,rgba(255,255,255,.7) 0 90px,transparent 91px);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px;border-radius:10px}
.hide{display:none!important}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:400;letter-spacing:.3px;line-height:1.1}
h2{font-size:26px}
h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- botones con relieve ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;font-weight:900;font-size:16px;
  background:var(--oceano);color:#fff;border-bottom:5px solid var(--oceano-d);transition:transform .08s,border-width .08s;user-select:none}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.coral{background:var(--coral);border-color:var(--coral-d)}
.btn.sol{background:var(--sol);border-color:var(--sol-d);color:var(--abismo)}
.btn.alga{background:var(--alga);border-color:var(--alga-d)}
.btn.ghost{background:#fff;color:var(--oceano);border:2px solid var(--linea);border-bottom:5px solid var(--linea)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px;border-bottom-width:4px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- estructura ---------- */
#app{max-width:620px;margin:0 auto;min-height:100%;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(234,246,251,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--linea)}
.brand{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.brand svg{width:46px;height:38px;flex:none}
.brand b{font-family:var(--disp);font-size:18px;line-height:.95;color:var(--oceano);font-weight:400}
@media(min-width:480px){.brand b br{display:none}.brand b{font-size:22px}}
.ibtn{position:relative;width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--linea);border-bottom-width:4px;display:grid;place-items:center;font-size:21px;flex:none}
.ibtn:active{transform:translateY(2px);border-bottom-width:2px}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid var(--laguna)}
.ibtn.baby{width:auto;padding:0 10px 0 4px;gap:2px;display:flex;font-size:14px;font-weight:900;color:var(--uva)}
.ibtn.baby svg{width:34px;height:30px}
.ibtn.me{padding:0;overflow:hidden}
.ibtn.me svg{width:42px;height:36px}
main{padding:16px 14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:#fff;border-top:2px solid var(--linea);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{display:flex;gap:6px;width:100%;max-width:620px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:14px;font-size:12px;font-weight:900;color:var(--muted);position:relative;border:2px solid transparent}
.tab i{font-style:normal;font-size:23px;line-height:1.1;filter:grayscale(.6);opacity:.75}
.tab.on{background:var(--laguna);border-color:var(--linea);color:var(--oceano)}
.tab.on i{filter:none;opacity:1}
.tab .badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-size:11px;display:grid;place-items:center}

/* ---------- paneles ---------- */
.panel{background:#fff;border-radius:22px;border:2px solid var(--linea);border-bottom-width:5px;padding:16px;margin-bottom:14px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec-t h3{color:var(--abismo)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.lv1{background:#FFF3CF;color:#8A6200}.lv2{background:#D7F5EC;color:#0E6F55}.lv3{background:#DCEBFA;color:#0B4F7E}.lv4{background:#FFE1DB;color:#B23A26}
.st-banco{background:#E7EDF2;color:#46627A}
.stars{color:var(--sol);letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:#D8E3EA}
.empty{text-align:center;padding:30px 18px}
.empty .e-ico{font-size:44px}
.empty p{margin:6px auto 14px;max-width:34ch;color:var(--muted)}

/* ---------- idear ---------- */
.hero{background:var(--oceano);color:#fff;border-radius:26px;padding:20px 18px 18px;border-bottom:6px solid var(--oceano-d);position:relative;overflow:hidden}
.hero h2{font-size:30px;max-width:13ch}
.hero p{opacity:.9;margin:6px 0 14px;max-width:30ch}
.hero svg.hk{position:absolute;right:-8px;bottom:6px;width:150px;height:125px;transform:rotate(-4deg)}
.hero .wave{position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-radial-gradient(circle at 10px -4px,transparent 0 9px,rgba(255,255,255,.12) 9px 11px,transparent 11px 20px);background-size:20px 18px}
.task{display:flex;gap:12px;align-items:center}
.task .t-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.task .t-txt{flex:1;min-width:0}
.task .t-txt b{display:block}
.qday{background:#F4EEFF;border-color:#E2D6FF}
.qday .q{font-weight:800;font-size:18px;margin:6px 0 10px}

/* ---------- tarjetas de ideas ---------- */
.icard{display:block;width:100%;text-align:left}
.icard .ih{display:flex;align-items:center;gap:10px}
.icard .ih svg{width:48px;height:40px;flex:none}
.icard h4{font-size:18px;font-weight:900;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.vbar{height:10px;border-radius:6px;background:var(--laguna2);overflow:hidden;margin-top:10px}
.vbar span{display:block;height:100%;background:var(--alga);border-radius:6px}

/* ---------- camino tipo Duolingo ---------- */
.path{display:flex;align-items:center;margin:14px 2px 6px}
.node{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:#E3ECF2;border-bottom:5px solid #C5D4DF;color:#9AB0C0}
.node small{position:absolute;top:54px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:var(--muted);white-space:nowrap}
.node.done{background:var(--sol);border-color:var(--sol-d);color:var(--abismo)}
.node.cur{color:#fff}
.node.cur.l1{background:#F2A900;border-color:#B37D00}.node.cur.l2{background:var(--alga);border-color:var(--alga-d)}.node.cur.l3{background:var(--oceano);border-color:var(--oceano-d)}.node.cur.l4{background:var(--coral);border-color:var(--coral-d)}
.node.cur::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid currentColor;opacity:.0;animation:ring 1.8s ease-out infinite}
.node.cur.l1::after{border-color:#F2A900}.node.cur.l2::after{border-color:var(--alga)}.node.cur.l3::after{border-color:var(--oceano)}.node.cur.l4::after{border-color:var(--coral)}
.node.frozen{background:#DDE8EF;border-color:#B9CAD6;color:#7890A4}
@keyframes ring{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.road{flex:1;height:8px;background:repeating-linear-gradient(90deg,#C5D4DF 0 10px,transparent 10px 16px);margin:0 4px;border-radius:4px}
.road.done{background:var(--sol)}
.path-sp{height:20px}

/* ---------- carrera ---------- */
.season{background:var(--abismo);color:#fff;border-radius:24px;padding:16px;border-bottom:6px solid #0A1E2E}
.season .srow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.season h2{font-size:32px;white-space:nowrap}
.season .dleft{text-align:right;font-weight:800;font-size:14px;opacity:.85}
.season .dleft b{display:block;font-family:var(--disp);font-size:26px;opacity:1;color:var(--sol);font-weight:400}
.mtrack{position:relative;height:34px;margin-top:14px;border-radius:10px;background:var(--asfalto);overflow:hidden}
.mtrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 26px);opacity:.5}
.mtrack .fin{position:absolute;right:0;top:0;bottom:0;width:18px;background:conic-gradient(#fff 25%,#222 0 50%,#fff 0 75%,#222 0) 0 0/9px 9px}
.mtrack svg{position:absolute;top:1px;width:40px;height:33px;transform:translateX(-50%)}
.champ{margin-top:12px;font-size:14px;font-weight:800;color:var(--sol)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin:18px 0 6px}
.pd{text-align:center}
.pd svg{width:78px;height:65px;display:block;margin:0 auto -4px}
.pd .blk{border-radius:14px 14px 6px 6px;color:#fff;font-family:var(--disp);font-size:30px;padding-top:6px}
.pd .nm{font-weight:900;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .pt{font-size:13px;font-weight:800;color:var(--muted)}
.p1 .blk{height:96px;background:var(--sol);color:var(--abismo);border-bottom:5px solid var(--sol-d)}
.p2 .blk{height:70px;background:#AFC3D2;border-bottom:5px solid #869DB0}
.p3 .blk{height:54px;background:#E39A6B;border-bottom:5px solid #B8703F}
.grid{padding:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 4px;border-radius:16px}
.row+.row{border-top:2px dashed var(--laguna2);border-radius:0}
.row .pos{font-family:var(--disp);font-size:20px;width:40px;text-align:center;color:var(--muted)}
.row.top1 .pos{color:var(--sol-d)}
.row svg{width:54px;height:45px;flex:none}
.row .who{flex:1;min-width:0}
.row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pts{font-family:var(--disp);font-size:22px;color:var(--oceano);text-align:right}
.row .pts small{display:block;font-family:var(--body);font-size:11px;font-weight:800;color:var(--muted)}
.row.me{background:#FFF8E1}
.plus{width:36px;height:36px;border-radius:12px;background:var(--coral);color:#fff;font-size:24px;font-weight:900;border-bottom:4px solid var(--coral-d);display:grid;place-items:center;flex:none}

/* ---------- modal / hoja ---------- */
.veil{position:fixed;inset:0;z-index:60;background:rgba(20,50,74,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--laguna);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:26px;max-height:88%}}
.sh-top{position:sticky;top:0;z-index:2;background:var(--laguna);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.sh-top h3{flex:1}
.x{width:40px;height:40px;border-radius:12px;background:#fff;border:2px solid var(--linea);font-size:20px;font-weight:900;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* ---------- formularios ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-weight:900;margin-bottom:4px}
.hint{display:flex;gap:6px;font-size:14px;color:#5A3FB0;background:#F4EEFF;border-radius:12px;padding:8px 10px;margin-bottom:6px}
input.in,textarea.in,select.in{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--linea);background:#fff;font-size:16px}
textarea.in{min-height:88px;resize:vertical}
input.in:focus,textarea.in:focus{outline:none;border-color:var(--oceano)}
.lvl-head{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.qa{margin-bottom:12px}
.qa b{display:block;font-size:14px;color:var(--muted)}
.qa p{white-space:pre-wrap}
details.lvl{background:#fff;border:2px solid var(--linea);border-radius:18px;padding:12px 14px;margin-bottom:10px}
details.lvl summary{font-weight:900;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.lvl summary::-webkit-details-marker{display:none}
details.lvl[open] summary{margin-bottom:10px}

/* ---------- votación ---------- */
.crit{background:#fff;border:2px solid var(--linea);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.crit .cn{font-weight:900}
.sbtns{display:flex;gap:6px;margin-top:8px}
.sbtns button{flex:1;height:46px;border-radius:12px;background:var(--laguna);border:2px solid var(--linea);font-size:24px;color:#C9D7E1;line-height:1}
.sbtns button.on{background:#FFF3CF;border-color:var(--sol);color:var(--sol)}
.anch{font-size:13px;font-weight:800;color:var(--muted);margin-top:6px;min-height:18px}
.secret{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 14px}

/* ---------- pin / login ---------- */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.logo-big{text-align:center;margin-bottom:12px}
.logo-big svg{width:170px;height:142px}
.logo-big h1{font-size:40px;color:var(--oceano);margin-top:-4px}
.pilots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%;max-width:560px}
.pilot{background:#fff;border:2px solid var(--linea);border-bottom-width:5px;border-radius:20px;padding:10px 6px 12px;text-align:center;font-weight:900}
.pilot svg{width:96px;height:80px}
.pilot.sel{border-color:var(--oceano);background:#F0F8FF}
.pilot .rl{display:block;font-size:12px;color:var(--uva)}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--linea)}
.dots i.f{background:var(--oceano);border-color:var(--oceano)}
.dots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pad button{height:62px;border-radius:18px;background:#fff;border:2px solid var(--linea);border-bottom-width:5px;font-family:var(--disp);font-size:26px;color:var(--abismo)}
.pad button:active{transform:translateY(3px);border-bottom-width:2px}



/* ---------- avatar editor ---------- */
.av-prev{display:grid;place-items:center;background:linear-gradient(#DDF0FA,#fff);border-radius:22px;border:2px solid var(--linea);padding:10px 0 0;margin-bottom:14px;overflow:hidden}
.av-prev svg{width:220px;height:184px}
.opt-t{font-weight:900;margin:12px 0 6px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:42px;height:42px;border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 2px var(--linea)}
.sw button.on{box-shadow:0 0 0 3px var(--abismo)}
.sw.acc button{background:#fff;font-size:22px}
.numr{display:flex;align-items:center;gap:10px}
.numr b{font-family:var(--disp);font-size:30px;min-width:50px;text-align:center}

/* ---------- campana ---------- */
.bell-list .ev{display:flex;gap:10px;padding:12px 4px;border-bottom:2px dashed var(--laguna2)}
.bell-list .ev.new{background:#FFF8E1;border-radius:14px;padding:12px 10px}
.bell-list .ev small{display:block;color:var(--muted);font-weight:700;font-size:12px}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;background:var(--abismo);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;max-width:520px;width:100%;animation:up .25s;box-shadow:0 10px 30px rgba(20,50,74,.25)}
.toast.err{background:var(--coral-d)}
.welcome{pointer-events:auto;position:relative;background:#fff;border:2px solid var(--linea);border-bottom:6px solid var(--oceano);border-radius:22px;padding:14px 44px 16px 14px;max-width:520px;width:100%;display:flex;gap:12px;align-items:center;animation:up .3s;box-shadow:0 14px 34px rgba(20,50,74,.22);overflow:hidden}
.welcome svg{width:70px;height:58px;flex:none}
.welcome b.h{font-family:var(--disp);font-size:21px;font-weight:400;display:block}
.welcome .l{font-size:14px;font-weight:700;color:var(--muted)}
.welcome .l strong{color:var(--abismo)}
.welcome .x{position:absolute;top:8px;right:8px;width:32px;height:32px;font-size:16px}
.welcome .tbar{position:absolute;left:0;bottom:0;height:4px;background:var(--sol);animation:tbar 7s linear forwards}
@keyframes tbar{from{width:100%}to{width:0}}

/* ---------- intro animada ---------- */
.intro{position:fixed;inset:0;z-index:100;background:linear-gradient(#7FD0F2 0%,#BFE8F8 45%,#8FD18A 45%,#6FBF6A 100%);overflow:hidden;display:flex;flex-direction:column}
.intro .ititle{text-align:center;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 6px;color:#fff;text-shadow:0 3px 0 var(--oceano-d)}
.intro .ititle h1{font-size:clamp(32px,9vw,54px)}
.intro .ititle p{font-weight:900;font-size:17px;margin-top:4px;text-shadow:none;color:var(--oceano-d)}
.lights{display:flex;gap:10px;justify-content:center;background:#22282F;border-radius:16px;padding:10px 14px;margin:10px auto 0;width:max-content;border-bottom:5px solid #111}
.lights i{width:30px;height:30px;border-radius:50%;background:#3A424C;transition:background .1s}
.lights i.on{background:#FF3B30;box-shadow:0 0 18px #FF3B30}
.lights.out i{background:#3A424C;box-shadow:none}
.itrack{position:relative;margin:auto 0;background:var(--asfalto);padding:14px 0;border-top:8px solid;border-bottom:8px solid;border-image:repeating-linear-gradient(90deg,#E53935 0 22px,#fff 22px 44px) 8}
.lane{position:relative;height:clamp(46px,8vh,64px)}
.lane+.lane{border-top:2px dashed rgba(255,255,255,.25)}
.kart{position:absolute;top:50%;left:calc(var(--p,0) * (100% - 86px));transform:translateY(-50%);width:80px;transition:left var(--d,2.4s) cubic-bezier(.35,.1,.25,1)}
.kart svg{width:80px;height:66px;display:block;margin-top:-6px}
.kart .kn{position:absolute;left:0;right:0;top:100%;margin-top:-10px;text-align:center;font-size:11px;font-weight:900;color:#fff;white-space:nowrap}
.driving .kart svg{animation:bump .18s ease-in-out infinite alternate}
.driving .kart::before{content:'';position:absolute;right:88%;top:44%;width:34px;height:14px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.7) 0 2px,transparent 2px 5px);border-radius:4px;opacity:.8}
@keyframes bump{to{transform:translateY(-2px) rotate(-1.5deg)}}
.iflag{position:absolute;right:0;top:0;bottom:0;width:34px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/17px 17px}
.ipod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:auto 0 12vh}
.ipod .pd{width:30%;max-width:150px}
.ipod .pd svg{width:100%;height:auto;animation:drop .7s cubic-bezier(.3,1.5,.5,1) backwards}
.ipod .p1 svg{animation-delay:1.1s}.ipod .p2 svg{animation-delay:.6s}.ipod .p3 svg{animation-delay:.2s}
.ipod .nm{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ipod .blk{animation:rise .6s ease-out backwards}
@keyframes drop{from{transform:translateY(-60vh)}}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}
.skip{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.9);color:var(--abismo);font-weight:900;border-radius:14px;padding:10px 16px;border-bottom:4px solid rgba(0,0,0,.2)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- academia ---------- */
.ac-hero{display:flex;gap:12px;align-items:center;background:#F4EEFF;border:2px solid #E2D6FF;border-bottom-width:5px;border-radius:22px;padding:12px 14px;margin-bottom:12px}

.menu{position:fixed;z-index:70;top:calc(62px + env(safe-area-inset-top,0px));right:max(12px,calc(50% - 298px));background:#fff;border:2px solid var(--linea);border-bottom-width:5px;border-radius:18px;padding:6px;min-width:210px;animation:up .15s}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--linea);border-top-color:var(--oceano);animation:rot 1s linear infinite;margin:30vh auto 0}

      '<button class="btn block" data-a="cfgSave">Guardar reglas</button></div>';
    sheet('⚙️ Administrador', html);
    if (editId || asGuest) setTimeout(function () { var f = document.getElementById('admForm'); if (f) f.scrollIntoView({ behavior: 'smooth' }); }, 60);
  });
}
function openInvite(m) {
  var t = inviteText(m);
  sheet('Invitación para ' + esc(m.nombre), '<div class="panel"><p style="white-space:pre-wrap">' + esc(t) + '</p></div><div class="acts"><button class="btn coral" data-a="invCopy">📋 Copiar</button>' + (navigator.share ? '<button class="btn ghost" data-a="invShare">📤 Enviar por WhatsApp u otra app</button>' : '') + '</div>');
  openInvite.t = t;
}
function admSave(btn) {
  var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
  var niv = [].slice.call(document.querySelectorAll('.mL:checked')).map(function (c) { return c.value; }).join(',') || '4';
  var a = document.getElementById('mA'), isNew = !g('mId');
  var m = { id: g('mId'), nombre: g('mN'), email: g('mE'), pin: g('mP'), peso: g('mW'), rol: g('mR'), niveles: niv, activo: a ? a.checked : true };
  busy(btn, true);
  api('saveMember', { m: m }).then(function (r) {
    busy(btn, false); if (!r.ok) return toast(r.error, true);
    toast('✅ Guardado'); reload();
    if (isNew) { api('members').then(function (x) { ADM = x; openInvite(m); }); } else openAdmin();
  });
}
function cfgSave(btn) {
  busy(btn, true);
  api('saveConfig', { cfg: { ideaDays: document.getElementById('cI').value, evalDays: document.getElementById('cE').value, threshold: document.getElementById('cT').value, mailNuevas: document.getElementById('cM').checked, appUrl: document.getElementById('cU').value } }).then(function (r) {
    busy(btn, false); if (!r.ok) return toast(r.error, true); toast('✅ Reglas guardadas'); reload();
  });
}
function phaseNow(btn) {
  var ide = ideacion();
  if (!confirm(ide ? '¿Abrir la evaluación ahora? Nadie podrá editar sus ideas hasta la próxima temporada.' : '¿Cerrar la evaluación y publicar los resultados? Arrancará la siguiente temporada.')) return;
  busy(btn, true);
  api('phaseNow').then(function (r) {
    busy(btn, false); if (!r.ok) return toast(r.error, true);
    closeSheet(); toast(r.fase === 'evaluacion' ? '⭐ ¡Abrió la evaluación!' : '🏁 Resultados publicados. Arrancó la temporada ' + r.temporada);
    if (r.fase !== 'evaluacion') confetti(90);
    LS.del('tec_intro_' + S.me.id + '_' + new Date().toDateString());
    reload().then(function () { showIntro(true).then(welcome); });
  });
}

// ===================== INTRO ANIMADA + BIENVENIDA =====================
function sceneFor(s) {
  var total = new Date(s.faseFin) - new Date(s.faseInicio), done = (Date.now() - new Date(s.faseInicio)) / (total || 1);
  if (s.fase === 'ideacion') return done < 0.3 ? 'salida' : 'carrera';
  return (new Date(s.faseFin) - Date.now()) < 86400000 ? 'podio' : 'final';
}
function showIntro(force) {
  var key = 'tec_intro_' + S.me.id + '_' + new Date().toDateString();
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!force && (LS.get(key, false) || reduce)) return Promise.resolve();
  LS.set(key, true);
  return new Promise(function (resolve) {
    var s = S.season, sc = sceneFor(s), b = S.board.slice(0, 8), n = b.length, rank = {};
    b.forEach(function (x, k) { rank[x.id] = k; });
    var lanes = b.slice().sort(function (x, y) { return mem(x.id).nombre.localeCompare(mem(y.id).nombre); });
    var T = {
      salida: ['Temporada ' + s.n, '¡Luces rojas… y a idear!'],
      carrera: ['¡A toda máquina!', 'Quedan ' + left(s.faseFin) + ' de ideación'],
      final: ['¡Recta final!', 'Los tiburones están evaluando'],
      podio: ['¡Último día!', 'Así va el podio de la temporada ' + s.n]
    }[sc];
    var el = document.createElement('div'); el.className = 'intro scene-' + sc;
    var body = '<div class="ititle"><h1>' + T[0] + '</h1><p>' + T[1] + '</p></div>';
    if (sc === 'salida') body += '<div class="lights" id="lights"><i></i><i></i><i></i><i></i><i></i></div>';
    if (sc === 'podio' && n >= 1) {
      var t = [b[1], b[0], b[2]], cls = ['p2', 'p1', 'p3'], num = [2, 1, 3];
      body += '<div class="ipod">' + t.map(function (x, k) { return x ? '<div class="pd ' + cls[k] + '">' + av(x.id) + '<div class="blk">' + num[k] + '</div><div class="nm">' + esc(mem(x.id).nombre) + '</div></div>' : '<div class="pd"></div>'; }).join('') + '</div>';
    } else {
      body += '<div class="itrack" id="itrack">' + (sc === 'final' ? '<span class="iflag"></span>' : '') + lanes.map(function (x) {
        var r = rank[x.id], rel = n > 1 ? r / (n - 1) : 0, p0 = 0, p1 = 0.6;
        if (sc === 'salida') { p0 = 0; p1 = 0.35 + 0.6 * (1 - rel); }
        if (sc === 'carrera') { p0 = 0.08 + 0.35 * rel; p1 = 0.4 + 0.55 * (1 - rel); }
        if (sc === 'final') { p0 = 0.25 + 0.2 * rel; p1 = 0.55 + 0.37 * (1 - rel); }
        return '<div class="lane"><div class="kart" data-p1="' + p1.toFixed(3) + '" style="--p:' + p0.toFixed(3) + ';--d:' + (2.3 + r * 0.18).toFixed(2) + 's">' + av(x.id) + '<div class="kn">' + esc(mem(x.id).nombre) + '</div></div></div>';
      }).join('') + '</div>';
    }
    el.innerHTML = body + '<button class="skip" id="skipI">Saltar ⏭</button>';
    document.body.appendChild(el);
    var timers = [], closed = false;
    var close = function () { if (closed) return; closed = true; timers.forEach(clearTimeout); el.style.transition = 'opacity .35s'; el.style.opacity = 0; setTimeout(function () { el.remove(); resolve(); }, 350); };
    el.querySelector('#skipI').onclick = close;
    var go = function () { var tr = el.querySelector('#itrack'); if (!tr) return; tr.classList.add('driving'); tr.querySelectorAll('.kart').forEach(function (k) { k.style.setProperty('--p', k.dataset.p1); }); };
    if (sc === 'salida') {
      el.querySelectorAll('#lights i').forEach(function (l, k) { timers.push(setTimeout(function () { l.classList.add('on'); }, 350 + k * 380)); });
      timers.push(setTimeout(function () { el.querySelector('#lights').classList.add('out'); go(); }, 2500));
      timers.push(setTimeout(close, 5600));
    } else if (sc === 'podio') { timers.push(setTimeout(function () { confetti(80); }, 1500)); timers.push(setTimeout(close, 5400)); }
    else { timers.push(setTimeout(go, 300)); timers.push(setTimeout(close, 4600)); }
  });
}
function welcome() {
  var b = S.board, k = -1, ide = ideacion();
  b.forEach(function (x, j) { if (x.id === S.me.id) k = j; });
  var p = pending().length, mine = S.ideas.filter(function (i) { return i.autorId === S.me.id; });
  var todo = mine.filter(function (i) { return i.estado === 'completar'; }).length;
  var lines = [];
  if (isGuest()) lines.push('Eres <strong>Tiburón Invitado</strong> de esta familia');
  else if (k >= 0) lines.push('<strong>' + (k + 1) + '° lugar</strong> con ' + b[k].season + ' pts esta temporada');
  lines.push(ide ? '💡 <strong>Ideación</strong>: quedan ' + left(S.season.faseFin) : '⭐ <strong>Evaluación</strong>: quedan ' + left(S.season.faseFin));
  var sr = mine.reduce(function (s, i) { return s + (i.sinResponder || 0); }, 0);
  if (!ide && sr) lines.push('❓ Tienes <strong>' + sr + '</strong> ' + (sr === 1 ? 'pregunta' : 'preguntas') + ' por responder');
  if (!ide) lines.push(p ? '⭐ <strong>' + p + '</strong> ' + (p === 1 ? 'idea espera' : 'ideas esperan') + ' tus estrellas' : '✅ Estás al día con las evaluaciones');
  else if (todo && !isGuest()) lines.push('🧩 Tienes <strong>' + todo + '</strong> ' + (todo === 1 ? 'nivel' : 'niveles') + ' por completar');
  var w = document.createElement('div'); w.className = 'welcome';
  w.innerHTML = av(S.me.id) + '<div><b class="h">¡Hola, ' + esc(S.me.nombre) + '!</b>' + lines.map(function (l) { return '<div class="l">' + l + '</div>'; }).join('') + '</div><button class="x" aria-label="Cerrar">✕</button><span class="tbar"></span>';
  var close = function () { w.style.transition = 'opacity .3s,transform .3s'; w.style.opacity = 0; w.style.transform = 'translateY(-10px)'; setTimeout(function () { w.remove(); }, 300); };
  w.querySelector('.x').onclick = close;
  document.getElementById('toasts').appendChild(w); setTimeout(close, 7000);
}

// ===================== EVENTOS =====================
var ACT = {
  tab: function (d) { TAB = d.t; LS.set('tec_tab', TAB); closeSheet(); render(); window.scrollTo(0, 0); },
  closeSheet: closeSheet,
  setup: function (d, el) {
    var n = document.getElementById('sN').value.trim(), e = document.getElementById('sE').value.trim(), p = document.getElementById('sP').value.trim();
    if (!n || !/^\d{4}$/.test(p)) return toast('Escribe tu nombre y un PIN de 4 números', true);
    busy(el, true);
    api('setup', { nombre: n, email: e, pin: p, appUrl: location.href.split('#')[0] }).then(function (r) {
      busy(el, false); if (!r.ok) return toast(r.error, true);
      SES = { memberId: r.memberId, pin: p }; LS.set('tec_ses', SES); boot();
    });
  },
  pilot: function (d) { openPin(d.id); },
  key: function (d) { pinKey(d.k); },
  form: function (d) { if (isGuest()) return; openForm(d.mode, d.id); },
  submitForm: function (d, el) { submitForm(el); },
  idea: function (d) { openIdea(d.id); },
  star: function (d) { setStar(Number(d.c), Number(d.v)); },
  sendVote: function (d, el) { sendVote(el); },
  copy: function (d) { copyIdea(d.id); },
  share: function (d) { shareIdea(d.id); },
  bell: openBell, menu: openMenu, rules: openRules,
  policy: function () { openPolicy(false); },
  policyOk: function () { closeSheet(); showIntro(false).then(welcome); },
  avatar: function () { openAvatar(false); },
  avPick: function (d) { AV[d.k] = d.v; document.querySelectorAll('.sw button[data-k="' + d.k + '"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === d.v); }); avRefresh(); },
  avNum: function (d) { AV.n = Math.min(99, Math.max(1, (Number(AV.n) || 1) + Number(d.d))); avRefresh(); },
  avSave: function (d, el) { avSave(el); },
  replay: function () { showIntro(true); },
  logout: function () { LS.del('tec_ses'); SES = null; S = null; closeSheet(); loadPublic(); },
  academia: function () { openAcademia(); },
  acTab: function (d) { AC_TAB = d.t; openAcademia(); var sh = document.querySelector('.sheet'); if (sh) sh.scrollTop = 0; },
  acOtra: function () { document.getElementById('acQ').textContent = PREGUNTAS_DIA[Math.floor(Math.random() * PREGUNTAS_DIA.length)]; },
  admin: function () { openAdmin(); },
  admNew: function () { openAdmin(null, false); },
  admEdit: function (d) { openAdmin(d.id); },
  admInvite: function (d) { var m = ADM.members.filter(function (x) { return x.id === d.id; })[0]; if (m) openInvite(m); },
  invite: function () { openAdmin(null, true); },
  invCopy: function () { copyText(openInvite.t, '📋 Invitación copiada'); },
  invShare: function () { navigator.share({ text: openInvite.t }).catch(function () { }); },
  admSave: function (d, el) { admSave(el); },
  cfgSave: function (d, el) { cfgSave(el); },
  phaseNow: function (d, el) { phaseNow(el); },
  ask: function (d, el) { var t = (document.getElementById('askT').value || '').trim(); if (t.length < 5) return toast('Escribe tu pregunta', true); qAct('ask', { ideaId: d.id, texto: t }, el, '❓ Pregunta enviada. Le avisamos al autor.'); },
  answer: function (d, el) { var t = (document.getElementById('at_' + d.id).value || '').trim(); if (t.length < 2) return toast('Escribe tu respuesta', true); qAct('answer', { preguntaId: d.id, texto: t }, el, '💬 Respuesta publicada'); },
  editAns: function (d) { var f = document.getElementById('af_' + d.id); if (f) { f.classList.remove('hide'); var t = document.getElementById('at_' + d.id); if (t) t.focus(); } },
  clarify: function (d, el) { qAct('clarify', { ideaId: d.id, texto: document.getElementById('clarT').value || '' }, el, '📌 Aclaración guardada'); },
  toggleQ: function (d, el) { qAct('toggleQ', { preguntaId: d.id }, el, 'Listo'); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var f = ACT[el.dataset.a]; if (f) { e.preventDefault(); f(el.dataset, el, e); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeSheet(); var m = document.getElementById('mveil'); if (m) m.remove(); }
  if (PILOT && document.getElementById('dots') && /^[0-9]$/.test(e.key)) pinKey(e.key);
  if (PILOT && document.getElementById('dots') && e.key === 'Backspace') pinKey('⌫');
});
boot();
</script>
